# Acceptance probe: federation must refuse this workflow file. Never merge.
name: Federation probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  federation-probe-wrong-workflow:
    name: federation-probe-wrong-workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLANNER_SERVICE_ACCOUNT }}
          token_format: access_token
