apiVersion: batch/v1
kind: CronJob
metadata:
  name: swm-indexer
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: swm-indexer
          restartPolicy: Never
          containers:
            - name: indexer
              image: northamerica-northeast2-docker.pkg.dev/stablecoinwhalemonitor/swm/swm:local
              args: ["scripts/fetch-usdc-logs.mjs", "--once"]
              envFrom:
                - configMapRef: { name: swm-config }
              env:
                - name: GOOGLE_BLOCKCHAIN_RPC_URL
                  valueFrom:
                    secretKeyRef: { name: swm-rpc, key: GOOGLE_BLOCKCHAIN_RPC_URL }
              resources:
                requests: { memory: 256Mi, cpu: 250m }
                limits: { memory: 512Mi }
